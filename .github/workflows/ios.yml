name: Build unsigned iOS IPA

# Commit the contents of this iOS folder as the repository root so the paths
# below resolve, then run this workflow manually (Actions -> Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project L4GRemote.xcodeproj \
            -scheme L4GRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/L4GRemote.app"
          test -d "$APP"
          rm -rf Payload L4G_AIMS_unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/L4GRemote.app
          zip -qry L4G_AIMS_unsigned.ipa Payload
          ls -lh L4G_AIMS_unsigned.ipa
          shasum -a 256 L4G_AIMS_unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: L4G_AIMS_unsigned_ipa
          path: L4G_AIMS_unsigned.ipa
          if-no-files-found: error
